{{- range .Values.apps }}
{{- if .service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "balenthiran.fullname" $ }}-{{ .name }}
  labels:
    app: {{ .name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .service.port }}
      targetPort: {{ .service.targetPort }}
      protocol: TCP
  selector:
    # `app` alone matches every other chart deployed into this namespace — they are all
    # generated from web-template and all label their pods `app: backend` / `app: frontend`.
    # Without `release` this Service load-balances across macro-metrics' and
    # holiday-planning's pods too, and 2 of every 3 /api requests 404.
    app: {{ .name }}
    release: {{ include "balenthiran.fullname" $ }}
---
{{- end }}
{{- end }}
