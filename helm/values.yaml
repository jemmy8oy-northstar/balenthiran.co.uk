# Matches the old balenthiran-helm chart's naming (release "balenthiran" +
# chart "balenthiranhelm") so this release replaces those resources in place
# instead of creating differently-named ones alongside them — the latter is
# what tripped the nginx admission webhook (duplicate host+path).
fullnameOverride: "balenthiran-balenthiranhelm"
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: balenthiran.co.uk
    # www.balenthiran.co.uk is a CNAME to the apex and lands on this same
    # controller, but nothing ever served it: http returned the default-backend
    # 404 and https presented nginx's self-signed "Kubernetes Ingress Controller
    # Fake Certificate". The apex sends HSTS with includeSubDomains, so that
    # warning is not click-through-able for anyone who has visited the site.
    - host: www.balenthiran.co.uk
    # Kit's future home. Same pods: the frontend sees this hostname and renders
    # the Kit splash instead of the portfolio, and its register-interest form
    # posts to this backend's /api (kit BEH-SPLASH-1, his 2026-11-02 23:50Z note).
    # DNS is a proxied Cloudflare record at Full (strict), so the origin needs
    # a real certificate, which is why it gets its own TLS entry below.
    - host: kitstudio.dev
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    - hosts:
        - balenthiran.co.uk
      secretName: balenthiran-tls
    # www gets its OWN certificate instead of joining the SAN list above.
    # macro-metrics and holiday-planning each declare an Ingress for the same
    # host with the same `balenthiran-tls` secret, so cert-manager's ingress-shim
    # derives one Certificate from three Ingresses: they must agree on that
    # entry. Adding a name to it here would make them disagree. A second entry
    # is invisible to them.
    - hosts:
        - www.balenthiran.co.uk
      secretName: balenthiran-www-tls
    - hosts:
        - kitstudio.dev
      secretName: kitstudio-tls
apps:
  - name: backend
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/balenthiran-backend
      tag: 0.1.185
      pullPolicy: Always
    containerPort: 8080
    replicas: 1
    service:
      port: 80
      targetPort: 8080
    ingress:
      path: /api
      pathType: Prefix
    env:
      - name: ConnectionStrings__DefaultConnection
        valueFrom:
          secretKeyRef:
            name: balenthiran-secrets
            key: DATABASE_URL
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  - name: main
    image:
      repository: lhr.ocir.io/lr7uc6l49odc/balenthiran
      tag: 0.1.185
      pullPolicy: Always
    containerPort: 80
    replicas: 1
    service:
      port: 80
      targetPort: 80
    ingress:
      path: /
      pathType: Prefix
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
