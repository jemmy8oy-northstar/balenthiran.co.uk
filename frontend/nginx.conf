server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # One canonical hostname. The ingress now terminates TLS for
    # www.balenthiran.co.uk and forwards it here with the original Host intact,
    # so the redirect belongs at this layer rather than on the Ingress: the
    # nginx-ingress `permanent-redirect` annotation also swallows
    # /.well-known/acme-challenge, which would stop cert-manager ever issuing
    # or renewing the www certificate (kubernetes/ingress-nginx#11315).
    # TLS terminates upstream, so $scheme is always http in here — the target
    # is written out rather than derived.
    if ($host = "www.balenthiran.co.uk") {
        return 301 https://balenthiran.co.uk$request_uri;
    }

    location / {
        try_files $uri /index.html;
    }

    # Optional: cache static files aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
